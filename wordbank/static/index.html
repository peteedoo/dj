<!doctype html>
<html><head><meta charset="utf-8"><title>Wordbank</title><style>
:root{color-scheme:dark}body{font:15px system-ui;background:#101214;color:#ddd;max-width:1100px;margin:2rem auto;padding:0 1rem}button,input{background:#20252a;color:inherit;border:1px solid #48515a;padding:.5rem}button{cursor:pointer}.word{display:inline-block;padding:.35rem .25rem;margin:.1rem;cursor:pointer}.word:hover,.word.selected{background:#c77dff;color:#111}.panel{background:#181c20;padding:1rem;margin:1rem 0}.samples audio{width:220px}.muted{color:#89929b}
</style></head><body><h1>WORD<span style="color:#c77dff">BANK</span></h1>
<section class=panel><input type=file id=file accept=audio/*><input id=speaker placeholder="speaker"><button onclick=upload()>INGEST</button><span id=status class=muted></span></section>
<section class=panel><input id=query placeholder="search words or phrases"><input id=filter placeholder="speaker"><button onclick=search()>SEARCH</button><div id=results></div></section>
<section class=panel><h2 id=cliptitle>Transcript</h2><audio id=player controls></audio><div id=transcript></div><label>Before <input id=before type=number step=.01 value=-.08></label><label>After <input id=after type=number step=.01 value=.12></label><button onclick=sample()>MAKE SAMPLE</button></section>
<section class="panel samples"><h2>Sample library</h2><div id=library></div></section>
<script>
let clip,selected=[];const $=id=>document.getElementById(id);
async function upload(){let f=$('file').files[0];if(!f)return;let d=new FormData;d.append('file',f);d.append('speaker',$('speaker').value);$('status').textContent=' indexing…';let r=await fetch('/clips',{method:'POST',body:d});clip=await r.json();render();$('status').textContent=' ready';}
function render(){ $('cliptitle').textContent=clip.original_filename; $('player').src='/clips/'+clip.id+'/audio';$('transcript').innerHTML=clip.words.map((w,i)=>`<span class=word data-i=${i} onclick="cue(${i})">${w.raw_word}</span>`).join('');document.querySelectorAll('.word').forEach(e=>e.onpointerdown=()=>{selected=[+e.dataset.i,+e.dataset.i];dragging=true;mark()});document.onpointerup=()=>dragging=false;document.querySelectorAll('.word').forEach(e=>e.onpointerenter=()=>{if(dragging)selected=[Math.min(selected[0],+e.dataset.i),Math.max(selected[0],+e.dataset.i)];mark()});}
function cue(i){$('player').currentTime=clip.words[i].start;$('player').play();if(!selected.length)selected=[i];else selected=[Math.min(selected[0],i),Math.max(selected[0],i)];document.querySelectorAll('.word').forEach((e,n)=>e.classList.toggle('selected',selected.length===2&&n>=selected[0]&&n<=selected[1]));}
function mark(){document.querySelectorAll('.word').forEach((e,n)=>e.classList.toggle('selected',n>=selected[0]&&n<=selected[1]));}
async function search(){let r=await fetch('/search?q='+encodeURIComponent($('query').value)+'&speaker='+encodeURIComponent($('filter').value));let d=await r.json();$('results').innerHTML=d.hits.map(h=>`<p><button onclick="load(${h.clip_id},${h.word_start},${h.word_end})">${h.text}</button> <span class=muted>${h.speaker||''} @ ${h.start.toFixed(2)}s</span></p>`).join('');}
async function load(id,a,b){clip=await (await fetch('/clips/'+id)).json();render();selected=[a,b];cue(a);}
async function sample(){if(selected.length<2)return;await fetch('/samples',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clip_id:clip.id,start_word:selected[0],end_word:selected[1],pad_before:+$('before').value,pad_after:+$('after').value})});samples();}
async function samples(){let d=await (await fetch('/samples')).json();$('library').innerHTML=d.map(s=>`<p>${s.text} <audio controls src="/samples/${s.id}/audio"></audio> <a href="/samples/${s.id}/audio" download>download</a></p>`).join('');}
samples();
</script></body></html>
